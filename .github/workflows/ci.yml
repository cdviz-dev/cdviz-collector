---
# inspiration:
# - [Tips for Faster Rust CI Builds | corrode Rust Consulting](https://corrode.dev/blog/tips-for-faster-ci-builds/)
name: ci

on:
  push:
    branches-ignore:
      - "release-plz-*"
  # no `pull_request`: `push` already covers every branch (and PR) of this repo, so CI runs once
  # per push. PRs from forks get no CI here.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    # "ubuntu-22.04-arm" vs "ubuntu-latest"
    # - faster? (not sure 10min for both with cold cache, and 4min (+1min) for arm on 90% cache'hit)
    # - fewer available => longer "queued times"
    runs-on: "ubuntu-latest"
    env:
      CARGO_TERM_COLOR: always
      # to help debug on failure (maybe conflict with disable of test debug)
      RUST_BACKTRACE: full
      # reduce size of target (good for caching); deliberately overrides
      # profile.test debug="line-tables-only" from Cargo.toml, which is meant for
      # local dev - CI wants the smallest target dir it can get
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          # version 2025.5.11, a symlink is created for rust setup
          # without cache, missing components are installed
          # with cache, nothing is installed, but as rust tool is symlinked, it is not cached => missing components failure
          cache: false
          cache_save: false
          experimental: true
      # after mise-action: uses the mbx installed by mise (mise.toml) and keys the
      # cache on its rustc. Default `github` backend restores target/ + cargo registry;
      # it saves only on pushes to the default branch (PRs, forks, schedules restore-only).
      # cargo runs through mbx because of the rust `mr_boxington` option in mise.toml.
      - uses: jdx/mr-boxington-action@v1
      - name: install cdviz-collector
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/cdviz-dev/cdviz-collector/releases/latest/download/cdviz-collector-installer.sh \
            | sh
        shell: bash
      - name: run CI and report test results
        run: |
          cdviz-collector send --run testsuiterun_junit \
            --data "target/nextest/default/junit.xml" \
            --metadata "suite_name=/cdviz-collector/ci" \
            --metadata "tested_artifact_id=pkg:oci/cdviz-collector" \
            --url "${CDVIZ_COLLECTOR_URL}" \
            -- mise run --jobs 1 ci
          # --log-full-response-on-error \
        shell: bash
        env:
          CDVIZ_COLLECTOR_URL: ${{ secrets.CDVIZ_COLLECTOR_URL }}
          CDVIZ_COLLECTOR__SINKS__HTTP__HEADERS__X-SIGNATURE__TYPE: "signature"
          CDVIZ_COLLECTOR__SINKS__HTTP__HEADERS__X-SIGNATURE__TOKEN: ${{ secrets.CDVIZ_COLLECTOR_TOKEN }}
          CDVIZ_COLLECTOR__SINKS__HTTP__HEADERS__X-SIGNATURE__SIGNATURE_PREFIX: "sha256="
          CDVIZ_COLLECTOR__SINKS__HTTP__HEADERS__X-SIGNATURE__SIGNATURE_ENCODING: "hex"

  # Keep only the newest mbx entry per <os>-<arch>-mbx-<generation>-<toolchain>
  # group (key minus the trailing commit sha): restore only ever picks the newest
  # one, and stale entries push the repo over its 10GB quota, where GitHub's LRU
  # eviction would drop the weekly-warmed release caches. A separate job without
  # checkout, so the actions:write token never shares a runner with build code
  # (deps' build.rs), and scoped to main's mbx entries (the sccache-rust-release*
  # entries are pruned by cache-warm-release.yml).
  cache-prune:
    needs: ci
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh cache list --ref refs/heads/main --limit 100 --json id,key,createdAt \
            --jq '[.[] | select(.key | contains("-mbx-"))] | group_by(.key | split("-") | .[:-1] | join("-")) | .[] | sort_by(.createdAt) | .[:-1][] | .id' \
            | xargs -r -n1 gh cache delete

---
# inspiration:
# - [Tips for Faster Rust CI Builds | corrode Rust Consulting](https://corrode.dev/blog/tips-for-faster-ci-builds/)
name: try-build-on

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner to build on"
        type: choice
        default: all
        options:
          - all
          - ubuntu-22.04
          - macos-15
          - windows-2025

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-on:
    # "ubuntu-22.04-arm" vs "ubuntu-latest"
    # - faster? (not sure 10min for both with cold cache, and 4min (+1min) for arm on 90% cache'hit)
    # - fewer available => longer "queued times"
    strategy:
      matrix:
        # ubuntu-24.04-arm also available
        runner: ${{ inputs.runner == 'all' && fromJSON('["ubuntu-22.04", "macos-15", "windows-2025"]') || fromJSON(format('["{0}"]', inputs.runner)) }}
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      # to help debug on failure (maybe conflict with disable of test debug)
      RUST_BACKTRACE: full
      # reduce size of target (good for caching); deliberately overrides
      # profile.test debug="line-tables-only" from Cargo.toml, which is meant for
      # local dev - CI wants the smallest target dir it can get
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: enable windows longpaths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache-restore
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked
        shell: bash
